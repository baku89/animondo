name: Deploy

# On push to main, mirror the `yarn generate` output (.output/public) to
# the SFTP server serving x.baku89.com/animondo. Nuxt emits hashed asset
# filenames on every build, so `--delete` is required to sweep stale
# assets off the server. (Modeled on baku89/corporate-poetry.)
#
# Required Secrets (Repository → Settings → Secrets and variables → Actions):
#   SFTP_HOST             e.g. suyarigasumi.xsrv.jp
#   SFTP_PORT             defaults to 22 when unset
#   SFTP_USER             SFTP user name
#   SFTP_PRIVATE_KEY      private key (whole OpenSSH PEM incl. newlines)
#   SFTP_REMOTE_DIR       public directory on the server
#                         e.g. /home/<user>/baku89.com/public_html/x.baku89.com/animondo
#   SFTP_HOST_FINGERPRINT (optional) output of `ssh-keyscan -p <port> <host>`.
#     Pinning it prevents MITM; when unset the workflow keyscans during CI
#     (TOFU equivalent).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Single deploy at a time; a newer push cancels an in-flight one to avoid
# interleaved mirror races.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn generate

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lftp

      - name: Configure SSH key & known_hosts
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || '22' }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_HOST_FINGERPRINT: ${{ secrets.SFTP_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # printf %s guarantees exactly one trailing newline (echo varies).
          printf '%s\n' "$SFTP_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if [ -n "${SFTP_HOST_FINGERPRINT}" ]; then
            printf '%s\n' "$SFTP_HOST_FINGERPRINT" > ~/.ssh/known_hosts
          else
            # TOFU: trust the server key on first contact. Set the secret to pin it.
            ssh-keyscan -p "$SFTP_PORT" -H "$SFTP_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Upload diff to SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || '22' }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
        run: |
          set -euo pipefail

          # lftp mirror --reverse: local → remote, sending only size/mtime
          # diffs. --delete sweeps stale hashed assets. --no-perms skips
          # permission sync, which shared hosts often disallow.
          # The trailing comma in `open -u "$SFTP_USER,"` tells lftp
          # "user X, empty password" — without it lftp prompts for a
          # password (no tty in CI) and fails; auth itself is handled by
          # the ssh connect-program with the key above.
          lftp <<EOF
          set sftp:connect-program "ssh -a -x -i $HOME/.ssh/id_deploy -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:timeout 30
          open -u "$SFTP_USER," "sftp://$SFTP_HOST:$SFTP_PORT"
          mirror \
            --reverse \
            --delete \
            --verbose \
            --parallel=4 \
            --no-perms \
            --exclude-glob .DS_Store \
            ./.output/public/ "$SFTP_REMOTE_DIR"
          bye
          EOF
